<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뽀모도로 타이머</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 부드러운 전환 효과를 위한 기본 스타일 */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f2f5; /* 기본 배경색 (웹사이트용) */
            transition: background-color 0.3s; /* 부드러운 전환 */
        }
        .timer-container {
            transition: all 0.3s ease-in-out;
        }
        /* 숨김/표시를 위한 클래스 */
        .hidden {
            display: none;
        }

        /* --- [NEW] PWA/앱 모드('창으로 열기') 최적화 --- */
        @media (display-mode: standalone) {
            body, html {
                /* 앱 모드일 때 배경색을 흰색으로 변경 */
                background-color: #ffffff; 
            }
            #timerContainer {
                /* 앱 모드일 때 그림자 제거 */
                box-shadow: none; 
            }
        }
        /* --- [END NEW] --- */

    </style>
</head>
<body class="font-sans">

    <!-- 
      [NOTE] 
      ID "timerContainer"는 PWA 스타일링을 위해 유지됩니다.
      Tailwind의 'shadow-xl'은 기본적으로 적용되지만,
      앱 모드에서는 위 <style>의 #timerContainer 규칙이 우선 적용되어 그림자가 사라집니다.
    -->
    <div id="timerContainer" class="relative timer-container bg-white rounded-2xl shadow-xl p-6 w-72 min-h-[18rem] flex flex-col items-center justify-center space-y-4">

        <!-- [NEW] 최소화/최대화 버튼 -->
        <button id="toggleMinimizeButton" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600 p-1 rounded-full z-10" title="최소화/최대화">
            <!-- 최소화 아이콘 (—) -->
            <svg id="iconMinimize" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
            <!-- 최대화 아이콘 (ㅁ) - 초기 숨김 -->
            <svg id="iconMaximize" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v16h16V4H4z"></path></svg>
        </button>


        <!-- 1. 시간 설정 화면 -->
        <div id="settingsView" class="flex flex-col items-center justify-center space-y-4 w-full">
            <label for="minutesInput" class="text-lg font-medium text-gray-700">몇 분 설정할까요?</label>
            <input
                type="number"
                id="minutesInput"
                min="1"
                max="120"
                value="25"
                class="w-24 text-center text-3xl font-bold p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
            >
            <button id="startButton" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg text-lg transition duration-200 shadow-md">
                시작
            </button>
        </div>

        <!-- 2. 타이머 작동 화면 (초기 숨김) -->
        <div id="timerView" class="hidden flex-col items-center justify-center space-y-4 w-full">
            
            <!-- 아날로그 시계 + 디지털 시간 -->
            <div class="relative w-48 h-48 mx-auto">
                <canvas id="analogClock" width="192" height="192" class="absolute top-0 left-0 w-full h-full"></canvas>
                <!-- 디지털 시간 표시 -->
                <div id="digitalTime" class="absolute inset-0 flex items-center justify-center text-4xl font-mono font-bold text-gray-800">
                    25:00
                </div>
            </div>

            <!-- 컨트롤 버튼 -->
            <div id="timerControls" class="flex space-x-4 w-full">
                <button id="pauseButton" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow">
                    일시정지
                </button>
                <button id="resetButton" class="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow">
                    초기화
                </button>
            </div>
        </div>

    </div>

    <script>
        // DOM 요소 가져오기
        const settingsView = document.getElementById('settingsView');
        const timerView = document.getElementById('timerView');
        const minutesInput = document.getElementById('minutesInput');
        const startButton = document.getElementById('startButton');
        const digitalTime = document.getElementById('digitalTime');
        const pauseButton = document.getElementById('pauseButton');
        const resetButton = document.getElementById('resetButton');
        
        // 캔버스 설정
        const canvas = document.getElementById('analogClock');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2 - 10;
        const center = canvas.width / 2;
        ctx.lineWidth = 16;

        // --- 최소화 관련 DOM 요소 ---
        const timerContainer = document.getElementById('timerContainer');
        const timerControls = document.getElementById('timerControls');
        const toggleMinimizeButton = document.getElementById('toggleMinimizeButton');
        const iconMinimize = document.getElementById('iconMinimize');
        const iconMaximize = document.getElementById('iconMaximize');

        // 타이머 상태 변수
        let timerInterval = null;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let isPaused = false;
        
        // --- 최소화 상태 변수 ---
        let isMinimized = false;

        // 시계 그리기 함수
        function drawClock() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 1. 시계 배경 (회색)
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#e5e7eb';
            ctx.stroke();
            // 2. 남은 시간 (빨간색)
            if (totalSeconds > 0) {
                const progress = remainingSeconds / totalSeconds;
                const startAngle = -Math.PI / 2;
                const endAngle = startAngle + (progress * 2 * Math.PI);
                ctx.beginPath();
                ctx.arc(center, center, radius, startAngle, endAngle);
                ctx.strokeStyle = '#ef4444';
                ctx.stroke();
            }
        }

        // 디지털 시간 업데이트
        function updateDigitalDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            digitalTime.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        // 1초마다 실행되는 틱(tick) 함수
        function tick() {
            if (isPaused) return;
            if (remainingSeconds > 0) {
                remainingSeconds--;
                drawClock();
                updateDigitalDisplay();
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
                digitalTime.textContent = "완료!";
            }
        }

        // 시작 버튼 클릭
        startButton.addEventListener('click', () => {
            const minutes = parseInt(minutesInput.value, 10);
            if (isNaN(minutes) || minutes < 1) {
                console.error("1분 이상의 시간을 입력해주세요.");
                return;
            }
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            isPaused = false;
            settingsView.classList.add('hidden');
            timerView.classList.remove('hidden');
            drawClock();
            updateDigitalDisplay();
            timerInterval = setInterval(tick, 1000);
        });

        // 일시정지/재개 버튼 클릭
        pauseButton.addEventListener('click', () => {
            if (timerInterval) {
                isPaused = !isPaused;
                pauseButton.textContent = isPaused ? '계속' : '일시정지';
                pauseButton.classList.toggle('bg-yellow-500', !isPaused);
                pauseButton.classList.toggle('hover:bg-yellow-600', !isPaused);
                pauseButton.classList.toggle('bg-green-500', isPaused);
                pauseButton.classList.toggle('hover:bg-green-600', isPaused);
            }
        });

        // 초기화 버튼 클릭
        resetButton.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
            isPaused = false;
            pauseButton.textContent = '일시정지';
            pauseButton.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
            pauseButton.classList.remove('bg-green-500', 'hover:bg-green-600');
            timerView.classList.add('hidden');
            settingsView.classList.remove('hidden');
            digitalTime.textContent = `${String(minutesInput.value).padStart(2, '0')}:00`;
            // 초기화 시 시계판도 리셋
            totalSeconds = 0;
            remainingSeconds = 0;
            drawClock();
        });
        
        // --- 최소화/최대화 토글 함수 ---
        function toggleMinimize() {
            if (isMinimized) {
                // --- 최대화 로직 ---
                // 1. 컨테이너 크기 복원
                timerContainer.classList.add('w-72', 'min-h-[18rem]', 'p-6', 'space-y-4');
                timerContainer.classList.remove('w-56', 'h-56', 'p-4');
                // 2. 디지털 시간 복원
                digitalTime.classList.remove('hidden');
                // 3. 이전 상태(설정 or 타이머)에 따라 뷰 복원
                if (timerInterval === null) {
                    // 타이머가 멈춘 상태(설정 화면)
                    settingsView.classList.remove('hidden');
                    timerView.classList.add('hidden');
                } else {
                    // 타이머가 실행/일시정지 중
                    settingsView.classList.add('hidden');
                    timerView.classList.remove('hidden');
                    timerControls.classList.remove('hidden'); // 컨트롤 버튼 복원
                }
                // 4. 아이콘 변경
                iconMinimize.classList.remove('hidden');
                iconMaximize.classList.add('hidden');
            } else {
                // --- 최소화 로직 ---
                // 1. 컨테이너 크기 축소 (w-48, h-48이 시계 크기, p-4는 패딩)
                timerContainer.classList.remove('w-72', 'min-h-[18rem]', 'p-6', 'space-y-4');
                timerContainer.classList.add('w-56', 'h-56', 'p-4');
                // 2. 설정화면, 컨트롤 숨기기
                settingsView.classList.add('hidden');
                timerControls.classList.add('hidden');
                // (디지털 시간은 숨기지 않음)
                // 3. 타이머 뷰(시계)는 무조건 보이게
                timerView.classList.remove('hidden');
                // 4. 아이콘 변경
                iconMinimize.classList.add('hidden');
                iconMaximize.classList.remove('hidden');
            }
            // 상태 변수 업데이트
            isMinimized = !isMinimized;
        }

        // --- 최소화 버튼 클릭 리스너 ---
        toggleMinimizeButton.addEventListener('click', toggleMinimize);
        
        // 초기 로드 시 시계 테두리 그리기 (배경만)
        drawClock();
    </script>
</body>
</html>
