<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뽀모도로 타이머</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 부드러운 전환 효과를 위한 기본 스타일 */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f2f5;
        }
        .timer-container {
            transition: all 0.3s ease-in-out;
        }
        /* 숨김/표시를 위한 클래스 */
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="font-sans">

    <!-- 타이머 전체 컨테이너 -->
    <div id="timerContainer" class="timer-container bg-white rounded-2xl shadow-xl p-6 w-72 min-h-[18rem] flex flex-col items-center justify-center space-y-4">

        <!-- 1. 시간 설정 화면 -->
        <div id="settingsView" class="flex flex-col items-center justify-center space-y-4 w-full">
            <label for="minutesInput" class="text-lg font-medium text-gray-700">몇 분 설정할까요?</label>
            <input
                type="number"
                id="minutesInput"
                min="1"
                max="120"
                value="25"
                class="w-24 text-center text-3xl font-bold p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none"
            >
            <button id="startButton" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg text-lg transition duration-200 shadow-md">
                시작
            </button>
        </div>

        <!-- 2. 타이머 작동 화면 (초기 숨김) -->
        <div id="timerView" class="hidden flex-col items-center justify-center space-y-4 w-full">
            
            <!-- 아날로그 시계 + 디지털 시간 -->
            <div class="relative w-48 h-48 mx-auto"> <!-- mx-auto를 추가하여 가운데 정렬을 명확히 합니다 -->
                <!-- 캔버스 (아날로그 시계) -->
                <canvas id="analogClock" width="192" height="192" class="absolute top-0 left-0 w-full h-full"></canvas>
                <!-- 디지털 시간 표시 -->
                <div id="digitalTime" class="absolute inset-0 flex items-center justify-center text-4xl font-mono font-bold text-gray-800">
                    25:00
                </div>
            </div>

            <!-- 컨트롤 버튼 -->
            <div class="flex space-x-4 w-full">
                <button id="pauseButton" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow">
                    일시정지
                </button>
                <button id="resetButton" class="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow">
                    초기화
                </button>
            </div>
        </div>

    </div>

    <script>
        // DOM 요소 가져오기
        const settingsView = document.getElementById('settingsView');
        const timerView = document.getElementById('timerView');
        const minutesInput = document.getElementById('minutesInput');
        const startButton = document.getElementById('startButton');
        const digitalTime = document.getElementById('digitalTime');
        const pauseButton = document.getElementById('pauseButton');
        const resetButton = document.getElementById('resetButton');
        
        // 캔버스 설정
        const canvas = document.getElementById('analogClock');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2 - 10; // 캔버스 크기의 절반 (패딩 10px)
        const center = canvas.width / 2;
        ctx.lineWidth = 16; // 선 굵기

        // 타이머 상태 변수
        let timerInterval = null;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let isPaused = false;

        // 시계 그리기 함수
        function drawClock() {
            // 캔버스 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 시계 배경 (회색)
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#e5e7eb'; // tailwind gray-200
            ctx.stroke();

            // 2. 남은 시간 (빨간색)
            if (totalSeconds > 0) {
                const progress = remainingSeconds / totalSeconds;
                const startAngle = -Math.PI / 2; // 12시 방향
                const endAngle = startAngle + (progress * 2 * Math.PI);
                
                ctx.beginPath();
                ctx.arc(center, center, radius, startAngle, endAngle);
                ctx.strokeStyle = '#ef4444'; // tailwind red-500
                ctx.stroke();
            }
        }

        // 디지털 시간 업데이트
        function updateDigitalDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            digitalTime.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        // 1초마다 실행되는 틱(tick) 함수
        function tick() {
            if (isPaused) {
                return;
            }

            if (remainingSeconds > 0) {
                remainingSeconds--;
                drawClock();
                updateDigitalDisplay();
            } else {
                // 타이머 종료
                clearInterval(timerInterval);
                timerInterval = null;
                digitalTime.textContent = "완료!";
                // TODO: 알림 소리 (브라우저 정책상 사용자 인터랙션 필요)
                // new Audio('https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3').play();
            }
        }

        // 시작 버튼 클릭
        startButton.addEventListener('click', () => {
            // alert는 GitHub Pages에서 작동하지만, 여기서는 console.error로 대체합니다.
            // (사용자 요청 시 alert 대신 모달을 구현할 수 있습니다.)
            const minutes = parseInt(minutesInput.value, 10);
            if (isNaN(minutes) || minutes < 1) {
                console.error("1분 이상의 시간을 입력해주세요."); 
                // 원래 코드: alert("1분 이상의 시간을 입력해주세요.");
                return;
            }

            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            isPaused = false;

            // 화면 전환
            settingsView.classList.add('hidden');
            timerView.classList.remove('hidden');

            // 타이머 그리기 및 시작
            drawClock();
            updateDigitalDisplay();
            timerInterval = setInterval(tick, 1000);
        });

        // 일시정지/재개 버튼 클릭
        pauseButton.addEventListener('click', () => {
            if (timerInterval) { // 타이머가 실행 중일 때만
                isPaused = !isPaused;
                pauseButton.textContent = isPaused ? '계속' : '일시정지';
                pauseButton.classList.toggle('bg-yellow-500', !isPaused);
                pauseButton.classList.toggle('hover:bg-yellow-600', !isPaused);
                pauseButton.classList.toggle('bg-green-500', isPaused);
                pauseButton.classList.toggle('hover:bg-green-600', isPaused);
            }
        });

        // 초기화 버튼 클릭
        resetButton.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
            isPaused = false;

            // 버튼 텍스트/스타일 원복
            pauseButton.textContent = '일시정지';
            pauseButton.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
            pauseButton.classList.remove('bg-green-500', 'hover:bg-green-600');

            // 화면 전환
            timerView.classList.add('hidden');
            settingsView.classList.remove('hidden');

            // 입력값은 유지
            digitalTime.textContent = `${String(minutesInput.value).padStart(2, '0')}:00`;
        });
        
        // 초기 로드 시 시계 테두리 그리기 (배경만)
        drawClock();
    </script>
</body>
</html>
